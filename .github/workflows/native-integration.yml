name: Native integration

on:
  push:
    branches:
      - main
    paths:
      - "hakoniwa_pdu_ros/**"
      - "config/action/**"
      - "config/service/**"
      - "schema/action-binding.schema.json"
      - "schema/service-binding.schema.json"
      - "test/**"
      - "task-action.md"
      - "task-service-client.md"
      - "package.xml"
      - "setup.py"
      - ".github/workflows/native-integration.yml"
  pull_request:
    paths:
      - "hakoniwa_pdu_ros/**"
      - "config/action/**"
      - "config/service/**"
      - "schema/action-binding.schema.json"
      - "schema/service-binding.schema.json"
      - "test/**"
      - "task-action.md"
      - "task-service-client.md"
      - "package.xml"
      - "setup.py"
      - ".github/workflows/native-integration.yml"
  workflow_dispatch:

jobs:
  native-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Run ROS 2 Jazzy native integration tests
        run: bash test/docker/run_native_tests.sh
